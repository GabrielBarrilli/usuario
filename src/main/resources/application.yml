spring:
  application:
    name: usuario
  datasource:
    username: ${USER_DB}
    password: ${PASS_DB}
    url: ${URL_DB}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always

jwt:
  secret: ${JWT_SECRET}

via-cep.url: ${VIA_CEP_URL:https://viacep.com.br}
